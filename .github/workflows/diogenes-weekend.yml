name: Diogenes hafta sonu hazırlığı

# Cumartesi 08:00 UTC (Türkiye 11:00): evreni yeniler, gelecek haftanın bilanço/makro takvimini,
# sektör gücünü ve haftalık kâğıt sonucu hazırlar, özeti bildirir.
# Pazar 15:20 UTC: Claude hafta notunu (brief.json) ve takvim güncellemesini ntfy'den alıp kaydeder.
on:
  schedule:
    - cron: "0 8 * * 6"
    - cron: "20 15 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diogenes-data
  cancel-in-progress: false

jobs:
  weekend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/daily-increases-site-gumybo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: diogenes/scan/requirements.txt
      - run: pip install -r diogenes/scan/requirements.txt
      - run: python diogenes/scan/relay.py
      - run: python diogenes/scan/weekend.py
        if: github.event.schedule != '20 15 * * 0'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Sonuçları kaydet
        run: |
          git config user.name "diogenes-bot"
          git config user.email "diogenes-bot@users.noreply.github.com"
          git add diogenes/data diogenes/scan/universe.json diogenes/scan/macro.json
          git diff --cached --quiet || git commit -m "Diogenes hafta sonu $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin claude/daily-increases-site-gumybo || true
          git push
