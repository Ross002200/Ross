name: Diogenes haber defteri

# Hafta içi her gece (laboratuvardan sonra, aynı veri grubunda sırayla): evrendeki hisselerin günün şirket haberlerini
# toplar, türüne ve yönüne göre sınıflandırır, eski haberlere fiyatın tepkisini ölçer ve haber karnesini günceller.
# İşlem açmaz, emir vermez. Finnhub ücretsiz sınırı (dakikada 60 istek) yüzünden ~10 dakika sürer.
on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diogenes-data
  cancel-in-progress: false

jobs:
  haber:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/daily-increases-site-gumybo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: diogenes/scan/requirements.txt
      - run: pip install -r diogenes/scan/requirements.txt pytest
      - name: Testler
        run: python -m pytest -q diogenes/scan/tests/test_haber.py
      - name: Haberleri topla, ölç ve kaydet
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          BRANCH: claude/daily-increases-site-gumybo
        run: |
          python diogenes/scan/haber.py
          git config user.name "diogenes-bot"
          git config user.email "diogenes-bot@users.noreply.github.com"
          git add diogenes/data/olaylar.json diogenes/data/haber_karne.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Diogenes haber defteri $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && break
            echo "push denemesi $i başarısız"; sleep $((i * 6))
          done
