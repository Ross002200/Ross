name: Diogenes laboratuvar

# Hafta içi seans kapandıktan sonra (yaz ve kış saatinde de kapanıştan sonra) bir kez:
# şampiyon stratejilerini 2 yıllık veride yeniden test eder, canlı kâğıt denemeyi bir gün ilerletir,
# yarının bekleyen sinyallerini yazar. Bakiye kullanılmaz, emir verilmez.
on:
  schedule:
    - cron: "41 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diogenes-data
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/daily-increases-site-gumybo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: diogenes/scan/requirements.txt
      - run: pip install -r diogenes/scan/requirements.txt
      - name: Laboratuvarı çalıştır ve kaydet
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          BRANCH: claude/daily-increases-site-gumybo
        run: |
          python diogenes/scan/archive.py || echo "::warning::arşiv hata verdi"
          python diogenes/scan/earnings.py || echo "::warning::bilanço verisi hata verdi"
          python diogenes/scan/lab.py
          python diogenes/scan/research.py --live || echo "::warning::araştırma sinyalleri hata verdi"
          python diogenes/scan/swing.py || echo "::warning::swing hata verdi"
          git config user.name "diogenes-bot"
          git config user.email "diogenes-bot@users.noreply.github.com"
          git config merge.ours.driver true
          git add diogenes/data/lab.json diogenes/data/news_log.json diogenes/data/swing.json diogenes/archive
          [ -f diogenes/data/earnings.json ] && git add diogenes/data/earnings.json
          for f in research.json evolve.json; do [ -f "diogenes/data/$f" ] && git add "diogenes/data/$f"; done
          git diff --cached --quiet && exit 0
          git commit -q -m "Diogenes laboratuvar $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && break
            echo "push denemesi $i başarısız"; sleep $((i * 6))
          done
