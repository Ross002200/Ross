name: Diogenes günlük tarama

# Hafta içi (UTC): piyasa öncesi 12:00, seans boyunca her 30 dakikada bir, kapanış sonrası 21:15.
# Türkiye saatiyle 15:00, 16:00-23:30 arası yarım saatte bir, 00:15. GitHub zamanlamayı birkaç dakika geciktirebilir.
on:
  schedule:
    - cron: "0 12 * * 1-5"
    - cron: "*/30 13-20 * * 1-5"
    - cron: "15 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diogenes-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/daily-increases-site-gumybo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python diogenes/scan/scan.py
      - name: Sonuçları kaydet
        run: |
          git config user.name "diogenes-bot"
          git config user.email "diogenes-bot@users.noreply.github.com"
          git add diogenes/data
          git diff --cached --quiet || git commit -m "Diogenes tarama $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin claude/daily-increases-site-gumybo || true
          git push
