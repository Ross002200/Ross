name: Diogenes günlük tarama

# Hafta içi (UTC). Betik New York saatine bakarak ne yapacağına karar verir:
# 12:00 piyasa öncesi tarama; 13:00-21:45 arası 15 dakikada bir tarama + kâğıt pozisyon takibi
# (yaz ve kış saatinin ikisini de kapsar); 16:00 NY sonrası gün özeti bildirimi.
# GitHub zamanlamayı birkaç dakika geciktirebilir.
on:
  schedule:
    - cron: "0 12 * * 1-5"
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diogenes-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/daily-increases-site-gumybo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: diogenes/scan/requirements.txt
      - run: pip install -r diogenes/scan/requirements.txt
      - run: python diogenes/scan/relay.py
      - run: python diogenes/scan/scan.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Sonuçları kaydet
        run: |
          git config user.name "diogenes-bot"
          git config user.email "diogenes-bot@users.noreply.github.com"
          git add diogenes/data diogenes/scan/macro.json
          git diff --cached --quiet || git commit -m "Diogenes tarama $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin claude/daily-increases-site-gumybo || true
          git push
