<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ramazan Hoca</title>
<style>
 :root{--bg:#0e0f13;--card:#171921;--line:#272a36;--fg:#eceef4;--mut:#8b90a3;--red:#e63946;--blue:#6ea8ff}
 *{box-sizing:border-box} body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#241218,var(--bg));color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
 main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
 h1{font-size:20px;margin:0;text-align:center} .sub{color:var(--mut);text-align:center;font-size:13px;margin:2px 0 18px}
 #avatar{width:132px;height:132px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:64px;background:var(--card);border:3px solid var(--line);transition:.3s}
 #avatar.listen{border-color:var(--blue);box-shadow:0 0 0 0 #6ea8ff66;animation:pulse 1.4s infinite}
 #avatar.talk{border-color:var(--red);animation:talk .5s infinite alternate}
 @keyframes pulse{70%{box-shadow:0 0 0 24px #6ea8ff00}100%{box-shadow:0 0 0 0 #6ea8ff00}}
 @keyframes talk{to{transform:scale(1.07);box-shadow:0 0 36px #e6394688}}
 #status{text-align:center;color:var(--mut);font-size:14px;margin-bottom:16px;min-height:20px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
 label{font-size:13px;color:var(--mut)} .lvrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px} .lvrow b{font-size:18px;color:var(--fg)}
 input[type=range]{width:100%;accent-color:var(--red)} .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
 textarea{width:100%;background:#0f1117;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical;margin-top:6px}
 button{width:100%;padding:18px;font-size:18px;font-weight:600;border:0;border-radius:14px;color:#fff;cursor:pointer}
 #talk{background:linear-gradient(135deg,#e63946,#b5179e)} #stop{background:#2a2d3a}
 #log{display:flex;flex-direction:column;gap:8px;margin-top:14px}
 .me,.bot{padding:10px 13px;border-radius:14px;max-width:88%;line-height:1.45;font-size:15px}
 .me{background:#1d2a44;align-self:flex-end;color:#cfe0ff} .bot{background:#2a1a20;align-self:flex-start;color:#ffd5d0}
 .note{font-size:12px;color:var(--mut);text-align:center;margin-top:18px}
</style>
<main>
 <h1>Prof. Dr. Ramazan Hoca</h1>
 <div class="sub">Konyalı, centilmen, ağzı bozuk</div>
 <div id="avatar" class="idle">🧔</div>
 <div id="status">Hazır</div>
 <div class="card">
  <div class="lvrow"><label>Küfür seviyesi</label><span><b id="lv">3</b>/5 · <small id="lvn">orta</small></span></div>
  <input type="range" id="level" min="1" max="5" value="3">
  <div class="ticks"><span>hafif</span><span>orta</span><span>amansız</span></div>
 </div>
 <div class="card"><label>Alican hakkında detaylar (Hoca bunları kullanır)</label>
  <textarea id="facts" rows="3" placeholder="hep geç kalır, FIFA'da kaybeder, ders çalışmaz…"></textarea></div>
 <button id="talk">▶ Başlat</button>
 <button id="stop" hidden>⏹ Durdur</button>
 <div id="log"></div>
 <div class="note">Chrome ve mikrofon izni gerekir. Hoca konuşurken mikrofon kapalıdır.</div>
</main>
<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const log = document.getElementById('log'), msgs = []; const avatar=document.getElementById('avatar'), status=document.getElementById('status');
function setState(s,t){ avatar.className=s; status.textContent=t; }
const names = ['hafif','orta-hafif','orta','sert','amansız'];
level.oninput = () => { lv.textContent = level.value; lvn.textContent = names[level.value-1]; };
if(!SR) log.textContent = 'Bu tarayıcı ses tanımayı desteklemiyor, Chrome kullan.';
let audio, running = false, rec;
function add(cls, t){ const d=document.createElement('div'); d.className=cls; d.textContent=t; log.append(d); d.scrollIntoView({behavior:'smooth',block:'end'}); }
function stopAll(){ speechSynthesis.cancel(); if(audio) audio.pause(); }
function browserSpeak(t){ return new Promise(res=>{
  const u = new SpeechSynthesisUtterance(t); u.lang='tr-TR'; u.pitch=0.7; u.rate=1.0;
  const v = speechSynthesis.getVoices().find(v=>v.lang.startsWith('tr')); if(v) u.voice=v;
  u.onend = u.onerror = res; speechSynthesis.speak(u); }); }
async function speak(t, el){
  stopAll();
  if(el){
    const r = await fetch('/tts', {method:'POST', body: JSON.stringify({text:t})});
    if(r.ok){ audio = new Audio(URL.createObjectURL(await r.blob()));
      return new Promise(res=>{ audio.onended = audio.onerror = res; audio.play().catch(res); }); }
  }
  return browserSpeak(t);
}
async function ask(text, hidden){
  msgs.push({role:'user', content:text}); if(!hidden) add('me', text);
  const r = await fetch('/', {method:'POST', body: JSON.stringify({
    messages: msgs, facts: facts.value, level: level.value})});
  const j = await r.json();
  msgs.push({role:'assistant', content:j.text}); add('bot', j.text);
  await speak(j.text, j.el);
}
// Alican'ı dinle; 6 sn içinde ses yoksa null döner
function listen(){ return new Promise(res=>{
  rec = new SR(); rec.lang='tr-TR'; rec.interimResults=false;
  let done=false, finish=v=>{ if(!done){done=true; clearTimeout(t); res(v);} };
  const t = setTimeout(()=>{ try{rec.stop()}catch(e){} finish(null); }, 6000);
  rec.onresult = e => finish(e.results[0][0].transcript);
  rec.onerror = e => { if(e.error==='not-allowed'){ running=false; add('bot','Mikrofon izni yok.'); } finish(null); };
  rec.onend = () => finish(null);
  try{ rec.start(); }catch(e){ finish(null); } }); }
async function loop(){
  await ask('[Sohbet başladı. Karşındaki kim olursa olsun, hemen Alican’a laf sokarak ve küfrederek başla.]', true);
  while(running){
    setState('listen','Dinliyor… konuş');
    const heard = await listen();
    if(!running) break;
    setState('talk','Hoca konuşuyor');
    await ask(heard || '[Karşındaki sustu. Sen konuşmaya devam et, Alican’ı zorbalamayı sürdür.]', !heard);
  }
  setState('idle','Hazır'); talk.hidden=false; stop.hidden=true;
}
talk.onclick = () => { if(running||!SR) return; running=true; talk.hidden=true; stop.hidden=false; loop(); };
stop.onclick = () => { running=false; setState('idle','Durduruldu'); talk.hidden=false; stop.hidden=true; try{rec.abort()}catch(e){}; stopAll(); };
</script>
</html>
