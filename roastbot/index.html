<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ramazan Hoca</title>
<style>
 body{font-family:system-ui;background:#111;color:#eee;max-width:560px;margin:0 auto;padding:16px}
 textarea{width:100%;box-sizing:border-box;background:#222;color:#eee;border:1px solid #444;border-radius:8px;padding:8px}
 button{width:100%;padding:18px;font-size:20px;border:0;border-radius:12px;background:#e63946;color:#fff;margin:8px 0}
 #stop{background:#444;padding:10px;font-size:15px}
 input[type=range]{width:100%} #log{white-space:pre-wrap;line-height:1.5} .me{color:#8ab4f8} .bot{color:#ffb4a9;margin-bottom:6px}
</style>
<h2>🧔 Ramazan Hoca</h2>
<label>Küfür seviyesi: <b id="lv">3</b>/5 <small id="lvn">orta</small></label>
<input type="range" id="level" min="1" max="5" value="3">
<textarea id="facts" rows="3" placeholder="Alican hakkında komik detaylar (hep geç kalır, FIFA'da kaybeder...)"></textarea>
<button id="talk">🎤 Konuş</button>
<button id="stop">🔇 Sustur</button>
<div id="log"></div>
<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const log = document.getElementById('log'), msgs = [];
const names = ['hafif','orta-hafif','orta','sert','amansız'];
level.oninput = () => { lv.textContent = level.value; lvn.textContent = names[level.value-1]; };
if(!SR) log.textContent = 'Bu tarayıcı ses tanımayı desteklemiyor, Chrome kullan.';
let audio;
function add(cls, t){ const d=document.createElement('div'); d.className=cls; d.textContent=(cls=='me'?'Alican: ':'Ramazan Hoca: ')+t; log.prepend(d); }
function stopAll(){ speechSynthesis.cancel(); if(audio) audio.pause(); }
stop.onclick = stopAll;
function browserSpeak(t){
  const u = new SpeechSynthesisUtterance(t); u.lang='tr-TR'; u.pitch=0.6; u.rate=1.05;
  const v = speechSynthesis.getVoices().find(v=>v.lang.startsWith('tr')); if(v) u.voice=v;
  speechSynthesis.speak(u);
}
async function speak(t, el){
  stopAll();
  if(el){
    const r = await fetch('/tts', {method:'POST', body: JSON.stringify({text:t})});
    if(r.ok){ audio = new Audio(URL.createObjectURL(await r.blob())); return audio.play(); }
  }
  browserSpeak(t);
}
async function ask(text){
  msgs.push({role:'user', content:text}); add('me', text);
  const r = await fetch('/', {method:'POST', body: JSON.stringify({
    messages: msgs, facts: facts.value, level: level.value})});
  const j = await r.json();
  msgs.push({role:'assistant', content:j.text}); add('bot', j.text); speak(j.text, j.el);
}
talk.onclick = () => {
  stopAll();
  const rec = new SR(); rec.lang='tr-TR'; rec.interimResults=false;
  rec.onresult = e => ask(e.results[0][0].transcript);
  rec.onerror = e => add('bot', 'Mikrofon hatası: '+e.error);
  rec.start(); talk.textContent='🎤 Dinliyorum...';
  rec.onend = () => talk.textContent='🎤 Konuş';
};
</script>
</html>
