<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roast Bot</title>
<style>
 body{font-family:system-ui;background:#111;color:#eee;max-width:560px;margin:0 auto;padding:16px}
 input,textarea{width:100%;box-sizing:border-box;background:#222;color:#eee;border:1px solid #444;border-radius:8px;padding:8px;margin:4px 0}
 button{width:100%;padding:18px;font-size:20px;border:0;border-radius:12px;background:#e63946;color:#fff;margin:10px 0}
 #log{white-space:pre-wrap;line-height:1.5} .me{color:#8ab4f8} .bot{color:#ffb4a9}
</style>
<h2>🤖 Roast Bot</h2>
<input id="name" placeholder="Arkadaşının adı">
<textarea id="facts" rows="3" placeholder="Onun hakkında komik detaylar (ör: hep geç kalır, FIFA'da kaybeder...)"></textarea>
<button id="talk">🎤 Konuş</button>
<div id="log"></div>
<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const log = document.getElementById('log'), msgs = [];
if(!SR) log.textContent = 'Bu tarayıcı ses tanımayı desteklemiyor, Chrome kullan.';
function add(cls, t){ const d=document.createElement('div'); d.className=cls; d.textContent=(cls=='me'?'Sen: ':'Bot: ')+t; log.prepend(d); }
function speak(t){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang='tr-TR'; u.rate=1.05; u.pitch=0.7;
  const v = speechSynthesis.getVoices().find(v=>v.lang.startsWith('tr')); if(v) u.voice=v;
  speechSynthesis.speak(u);
}
async function ask(text){
  msgs.push({role:'user', content:text}); add('me', text);
  const r = await fetch('/', {method:'POST', body: JSON.stringify({
    messages: msgs, name: name.value, facts: facts.value})});
  const {text: reply} = await r.json();
  msgs.push({role:'assistant', content:reply}); add('bot', reply); speak(reply);
}
talk.onclick = () => {
  speechSynthesis.cancel();
  const rec = new SR(); rec.lang='tr-TR'; rec.interimResults=false;
  rec.onresult = e => ask(e.results[0][0].transcript);
  rec.onerror = e => add('bot', 'Mikrofon hatası: '+e.error);
  rec.start(); talk.textContent='🎤 Dinliyorum...';
  rec.onend = () => talk.textContent='🎤 Konuş';
};
</script>
</html>
