<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diogenes">
<meta name="theme-color" content="#15141C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<!--ARTIFACT-START-->
<title>Diogenes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
/* Zenon'un kardeşi: gece mürekkebi, keskin köşeler, ince çizgiler. Tek ekran: günün hisseleri.
   Yükseliş adaçayı yeşili, düşüş vermilyon; fener kehribarı yalnız vurgu. */
:root{
  --bg:#15141C; --panel:#1C1A24; --panel-2:#24212D; --ink:#F0E6D2; --ink-2:#B3A994; --ink-3:#7C7468;
  --line:#322E3C; --line-2:#4A4555; --up:#8FC38A; --down:#D9604A; --lamp:#E0A84E;
  --up-bg:rgba(143,195,138,.12); --down-bg:rgba(217,96,74,.12); --lamp-bg:rgba(224,168,78,.12);
  --display:"Shippori Mincho B1","Hiragino Mincho ProN",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,-apple-system,sans-serif;
  --mono:"Spline Sans Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#ECE5D3; --panel:#F4EEDF; --panel-2:#FAF6EC; --ink:#1E1B24; --ink-2:#5B5448; --ink-3:#8E8575;
  --line:#D3C7AA; --line-2:#B8AA88; --up:#3F7A3A; --down:#B8412F; --lamp:#A8701E;
  --up-bg:rgba(63,122,58,.1); --down-bg:rgba(184,65,47,.1); --lamp-bg:rgba(168,112,30,.1); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#ECE5D3; --panel:#F4EEDF; --panel-2:#FAF6EC; --ink:#1E1B24; --ink-2:#5B5448; --ink-3:#8E8575;
  --line:#D3C7AA; --line-2:#B8AA88; --up:#3F7A3A; --down:#B8412F; --lamp:#A8701E;
  --up-bg:rgba(63,122,58,.1); --down-bg:rgba(184,65,47,.1); --lamp-bg:rgba(168,112,30,.1); color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:1px solid var(--lamp);outline-offset:2px}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.up{color:var(--up)} .down{color:var(--down)} .lamp{color:var(--lamp)} .m2{color:var(--ink-2)} .m3{color:var(--ink-3)}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;height:56px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.08em}
.brand span{font-family:var(--display);font-size:12px;color:var(--lamp);letter-spacing:.18em}
.icon{width:34px;height:34px;border:1px solid var(--line-2);display:grid;place-items:center;background:none}
.icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5}

/* market line */
.mkt{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.mkt i{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--up)}
.mkt.warn i{background:var(--lamp)} .mkt.bad i{background:var(--down)}
.mkt b{font-weight:700}

/* hero */
.hero{padding:22px 0 14px}
.hero h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.01em}
.hero p{color:var(--ink-2);font-size:13.5px;margin-top:8px;max-width:46ch}
.seg{display:flex;border:1px solid var(--line-2);margin:6px 0 14px}
.seg button{flex:1;background:none;border:0;padding:9px 6px;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}

/* stock cards */
.list{display:grid;gap:0;border-top:1px solid var(--line)}
.stock{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:16px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.stock:active{background:var(--panel)}
.s-sym{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;letter-spacing:.02em}
.s-name{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch;margin-top:4px}
.s-right{text-align:right}
.s-tgt{font-family:var(--mono);font-size:20px;line-height:1;color:var(--up)}
.s-prob{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.track{grid-column:1 / -1;position:relative;height:6px;background:linear-gradient(90deg,var(--down-bg),var(--panel-2) 28%,var(--panel-2) 72%,var(--up-bg));border:1px solid var(--line);margin-top:4px}
.track .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-3)}
.track .now{position:absolute;top:-4px;width:3px;height:12px;background:var(--ink)}
.s-foot{grid-column:1 / -1;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2)}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--ink-2);padding:1px 6px;white-space:nowrap}
.tag.up{border-color:var(--up);color:var(--up)} .tag.down{border-color:var(--down);color:var(--down)} .tag.lamp{border-color:var(--lamp);color:var(--lamp)}
.empty{padding:40px 8px;text-align:center;color:var(--ink-2);font-size:14px}
.note{font-size:12px;color:var(--ink-3);padding:16px 0 0;line-height:1.55}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,9,14,.55);z-index:40}
.sheet{position:fixed;inset:0;z-index:41;overflow:auto;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.sheet .in{max-width:560px;margin:0 auto;padding:0 16px 40px;display:grid;gap:20px}
.sh-top{display:flex;justify-content:space-between;align-items:center;height:56px;border-bottom:1px solid var(--line)}
.sh-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sh-head .s-sym{font-size:34px}
.price{font-family:var(--mono);font-size:22px;text-align:right}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line)}
.boxes div{padding:12px 10px;display:grid;gap:2px}
.boxes div+div{border-left:1px solid var(--line)}
.boxes b{font-family:var(--mono);font-weight:500;font-size:16px}
.boxes small{font-size:11.5px;color:var(--ink-3)}
.odds{padding:14px;background:var(--panel);border:1px solid var(--line);font-size:14px;line-height:1.6}
.odds b{font-family:var(--mono);font-weight:500}
h2{font-family:var(--display);font-weight:800;font-size:18px;margin:0 0 8px}
ul.list2{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.list2 li{padding-left:16px;position:relative;font-size:14px}
ul.list2 li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;background:var(--up)}
ul.list2.risk li::before{background:var(--down)}
.analysis{border-left:2px solid var(--lamp);padding:2px 0 2px 12px;font-size:14px}
.news a{display:block;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:13.5px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line-2);background:none;padding:12px;font-weight:700;font-size:14px;text-align:center;text-decoration:none;display:block}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
pre.ticket{margin:0;padding:12px;background:var(--panel);border:1px solid var(--line);font:12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
label.f{display:grid;gap:6px;font-size:13px;color:var(--ink-2)}
input{background:var(--panel);border:1px solid var(--line-2);padding:11px;width:100%;font-size:16px}
.rowlink{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:14.5px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;font-size:13.5px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
<!--ARTIFACT-HEAD-END-->
</head>
<body>
<!--ARTIFACT-BODY-START-->
<div class="app">
  <header class="top">
    <div class="brand"><b>DIOGENES</b><span>ΔΙΟΓΕΝΗΣ</span></div>
    <button class="icon" type="button" id="openSet" aria-label="Ayarlar"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
  </header>
  <div class="mkt" id="mkt"><i></i><div class="m2">Yükleniyor…</div></div>

  <section class="hero">
    <p class="label" id="dateLbl"></p>
    <h1>Günün hisseleri</h1>
    <p>Açılışta alınır, stop en fazla %2, hedef +%2 ile +%5 arası. Yüzde, geçmişte benzer hisselerin hedefe ulaşma oranı. Ayrıntı için hisseye dokun.</p>
  </section>
  <div class="seg" role="tablist"><button type="button" class="on" data-seg="today">Bugün <span id="nToday"></span></button><button type="button" data-seg="follow">Takip <span id="nFollow"></span></button></div>
  <div class="list" id="list"></div>
  <p class="note" id="foot"></p>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=2)=>v==null||!isFinite(v)?'—':Number(v).toLocaleString('tr-TR',{minimumFractionDigits:Math.min(d,2),maximumFractionDigits:d});
const pct=v=>v==null||!isFinite(v)?'—':(v>0?'+':'')+fmt(v)+'%';
const usd=v=>v==null||!isFinite(v)?'—':'$'+Math.abs(v).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fhKey=()=>{try{return localStorage.getItem('diogenes.fh')||''}catch(e){return''}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2000)}

let WL=null,PA=null,LIVE={},SEG='today',FOLLOW=store.get('diogenes.follow2',[]);
const SET=Object.assign({bal:1000,risk:2},store.get('diogenes.simple',{}));

function live(it){return LIVE[it.symbol]??it.last??it.ref??it.prev_close}
function move(it){const e=it.entry||it.ref;const p=live(it);return e&&p?(p/e-1)*100:null}
function status(it){
  const s=it.status||'açılış bekleniyor';
  if(s==='hedef')return['Hedefe ulaştı','up'];
  if(s==='stop')return['Stop oldu','down'];
  if(s==='gün sonu')return['Gün kapandı '+pct(it.close_pct),''];
  if(s==='açık')return[(it.warned?'Haber değişti · ':'')+'Açık',it.warned?'down':'lamp'];
  return['Açılışta alınır',''];
}

function card(it,i){
  const mv=move(it),[lab,cls]=status(it),lo=-(it.stop_pct||2),hi=it.target_pct||3;
  const pos=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
  return `<button class="stock" type="button" data-i="${i}">
    <div><div class="s-sym">${esc(it.symbol)}</div><div class="s-name">${esc(it.name||'')}</div></div>
    <div class="s-right"><div class="s-tgt">+%${fmt(it.target_pct,0)}</div><div class="s-prob">hedef ihtimali %${fmt(it.prob_target,0)}</div></div>
    <div class="track" title="Stop −%${fmt(it.stop_pct,0)} · hedef +%${fmt(hi,0)}"><span class="zero" style="left:${pos(0)}%"></span>${mv!=null&&it.entry?`<span class="now" style="left:calc(${pos(mv)}% - 1px)"></span>`:''}</div>
    <div class="s-foot"><span class="num">${fmt(live(it))} $ ${it.entry?`<span class="${mv>0?'up':mv<0?'down':''}">${pct(mv)}</span>`:''}</span><span class="tag ${cls}">${esc(lab)}</span></div>
  </button>`;
}
function items(){return SEG==='today'?(WL&&WL.items||[]):FOLLOW.slice().reverse().map(f=>(WL&&WL.date===f.date&&(WL.items||[]).find(x=>x.symbol===f.symbol))||f)}
function render(){
  const its=items();
  $('#nToday').textContent=WL&&WL.items?`(${WL.items.length})`:'';$('#nFollow').textContent=FOLLOW.length?`(${FOLLOW.length})`:'';
  $('#list').innerHTML=its.length?its.map(card).join(''):`<p class="empty">${SEG==='today'?'Liste her işlem günü 15:00 (TR) civarında hazırlanır.':'Takip ettiğin hisse yok. Bir hisseye dokun, “Takibe al”.'}</p>`;
  const m=WL&&WL.market||{};const el=$('#mkt');const bad=(m.shield||[]).length,warn=(m.caution||[]).length||m.flag==='dikkat';
  el.className='mkt'+(bad?' bad':warn?' warn':'');
  el.innerHTML=`<i></i><div><b>${bad?'Piyasa zayıf.':warn?'Piyasa temkinli.':m.regime?'Piyasa sağlıklı.':''}</b> <span class="m2">${esc(bad?'Endeks düşüş eğiliminde; stoplar daha sık çalışır.':warn?'Dikkatli ol, pozisyonu küçük tut.':'Kurallar normal çalışır.')}</span>${m.morning?`<div class="m3" style="font-size:12.5px;margin-top:4px">${esc(m.morning)}</div>`:''}</div>`;
  const d=new Date();$('#dateLbl').textContent=d.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})+(WL&&WL.updated?' · '+new Date(WL.updated).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'');
  const h=WL&&WL.history;
  $('#foot').innerHTML=(h&&h.n?`Son ${h.days} günde listedeki ${h.n} hissenin %${fmt(h.win,0)}'i kârla kapandı (ortalama ${pct(h.avg_ret)}). `:'')+'Olasılıklar geçmişten hesaplanır, garanti değildir. Kaldıraç kullanma, stopu mutlaka koy.';
}

function ticket(it){
  const e=it.entry||live(it),stop=e*(1-(it.stop_pct||2)/100),tgt=e*(1+(it.target_pct||3)/100),per=e-stop;
  let q=Math.min((SET.bal*SET.risk/100-3)/per,SET.bal/e);q=q>=1?Math.floor(q):Math.floor(Math.max(0,q)*1000)/1000;
  return [`${it.symbol} · ${fmt(q,3)} adet (≈ ${usd(q*e)})`,`1) ALIŞ: piyasa emriyle ${it.entry?'(ya da '+fmt(e)+' $ limit)':'açılışta'}`,`2) STOP SATIŞ: ${fmt(stop)} $ (−%${fmt(it.stop_pct,0)})`,`3) HEDEF LİMİT SATIŞ: ${fmt(tgt)} $ (+%${fmt(it.target_pct,0)})`,`4) Kapanıştan önce hâlâ açıksa sat`,`Risk ≈ ${usd(q*per+3)} (komisyon dahil)`];
}
function open(it){
  const [lab,cls]=status(it),e=it.entry,mv=move(it),starred=FOLLOW.some(f=>f.symbol===it.symbol&&f.date===it.date);
  const stop=e?e*(1-it.stop_pct/100):null,tgt=e?e*(1+it.target_pct/100):null;
  $('#sheetIn').innerHTML=`<div class="sh-top"><button class="icon" type="button" id="back" aria-label="Geri"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></button><span class="tag ${cls}">${esc(lab)}</span></div>
   <div class="sh-head"><div><div class="s-sym">${esc(it.symbol)}</div><div class="s-name" style="max-width:none">${esc(it.name||'')}${it.sector?' · '+esc(it.sector):''}</div></div>
     <div class="price">${fmt(live(it))} $<div style="font-size:13px" class="${mv>0?'up':mv<0?'down':'m3'}">${e?pct(mv)+' girişten':'açılış bekleniyor'}</div></div></div>
   <div class="boxes"><div><span class="label">Giriş</span><b>${e?fmt(e):'Açılış'}</b><small>${esc(it.opened_at&&it.opened_at!=='açılış'?it.opened_at+' TR':'piyasa açılışı')}</small></div>
     <div><span class="label">Stop</span><b class="down">${stop?fmt(stop):'−%'+fmt(it.stop_pct,0)}</b><small>−%${fmt(it.stop_pct,0)}</small></div>
     <div><span class="label">Hedef</span><b class="up">${tgt?fmt(tgt):'+%'+fmt(it.target_pct,0)}</b><small>+%${fmt(it.target_pct,0)}</small></div></div>
   <div class="odds">Geçmişte bu gruptaki <b>${fmt(it.sample,0)}</b> benzer günün <b class="up">%${fmt(it.prob_target,0)}</b>'inde hedefe ulaşıldı, <b class="down">%${fmt(it.prob_stop,0)}</b>'inde stop çalıştı; kalanı gün içinde kapandı. Ortalama sonuç <b>${pct(it.avg_ret)}</b>.</div>
   ${it.warned?`<div class="analysis" style="border-color:var(--down)"><b class="down">Haber değişti:</b> ${esc(it.warned)}</div>`:''}
   <div><h2>Neden yükselebilir?</h2><ul class="list2">${(it.why||[]).map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>
   ${it.analysis?`<div><h2>Analiz</h2><p class="analysis">${esc(it.analysis)}</p></div>`:''}
   ${(it.news||[]).length?`<div><h2>Haberler</h2><div class="news">${it.news.map(n=>`<a href="${esc(n.link||'#')}" target="_blank" rel="noopener" class="${n.tone==='olumlu'?'up':n.tone==='olumsuz'?'down':''}">${esc(n.title)}</a>`).join('')}</div></div>`:''}
   <div><h2>Riskler</h2><ul class="list2 risk">${(it.risks||[]).map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>
   <div><h2>Midas emri</h2><pre class="ticket" id="tk">${esc(ticket(it).join('\n'))}</pre></div>
   <div class="btns"><button class="btn pri" type="button" id="star">${starred?'Takipten çıkar':'Takibe al'}</button><button class="btn" type="button" id="cp">Emri kopyala</button></div>
   <a class="btn" href="${esc(it.tv)}" target="_blank" rel="noopener">Grafiği aç</a>`;
  $('#sheet').hidden=false;$('#sheet').scrollTop=0;
  $('#back').onclick=close;$('#cp').onclick=()=>copy($('#tk').textContent);
  $('#star').onclick=()=>{const k=FOLLOW.findIndex(f=>f.symbol===it.symbol&&f.date===it.date);if(k>=0)FOLLOW.splice(k,1);else FOLLOW.push(Object.assign({},it));store.set('diogenes.follow2',FOLLOW.slice(-50));toast(k>=0?'Takipten çıkarıldı':'Takibe alındı');render();open(it)};
}
function close(){$('#sheet').hidden=true}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Kopyalandı')}catch(e){toast('Metni seçip kopyala')}}

function settings(){
  const P=PA||{trades:[]},cl=P.trades.filter(t=>t.status==='closed');
  $('#sheetIn').innerHTML=`<div class="sh-top"><button class="icon" type="button" id="back" aria-label="Geri"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></button><span class="label">Ayarlar</span></div>
   <label class="f">Midas bakiyem ($)<input id="bal" inputmode="decimal" value="${SET.bal}"></label>
   <label class="f">İşlem başı risk (%) · emirdeki adet buna göre<input id="risk" inputmode="decimal" value="${SET.risk}"></label>
   <label class="f">Canlı fiyat anahtarı (Finnhub, ücretsiz)<input id="fh" type="password" autocomplete="off" value="${esc(fhKey())}"></label>
   <button class="btn pri" type="button" id="save">Kaydet</button>
   <div><a class="rowlink" href="pro.html"><span>Sistemin kâğıt hesabı ve ayrıntılar</span><span class="num m2">${usd(P.equity)} · ${cl.length} işlem</span></a>
   <a class="rowlink" href="https://finnhub.io/register" target="_blank" rel="noopener"><span>Ücretsiz canlı fiyat anahtarı al</span><span class="m3">›</span></a>
   <div class="rowlink"><span>Bildirim konusu (ntfy)</span><span class="num lamp">${esc(WL&&WL.ntfy||'diogenes-05ba7a13cae4')}</span></div></div>
   <p class="note">Liste her işlem günü hazırlanır: Claude sabah haberleri okur, sistem trend, göreli güç, hacim ve oynaklığa bakar; geçmişte zarar ettiren hisse türlerini eler. Gün içinde iyi haber alan hisseler eklenebilir. Bu bir öğrenme aracıdır, yatırım tavsiyesi değildir.</p>`;
  $('#sheet').hidden=false;$('#sheet').scrollTop=0;$('#back').onclick=close;
  $('#save').onclick=()=>{const b=parseFloat(String($('#bal').value).replace(',','.')),r=parseFloat(String($('#risk').value).replace(',','.'));if(b>0)SET.bal=b;if(r>0&&r<=5)SET.risk=r;store.set('diogenes.simple',SET);
    const k=$('#fh').value.trim();try{k?localStorage.setItem('diogenes.fh',k):localStorage.removeItem('diogenes.fh')}catch(e){}toast('Kaydedildi');close();poll()};
}

async function load(){
  const get=u=>fetch(u+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
  [WL,PA]=await Promise.all(['data/watchlist.json','data/paper.json'].map(get));render();poll();
}
async function poll(){
  const k=fhKey();if(!k||document.hidden)return;
  const syms=[...new Set((WL&&WL.items||[]).map(x=>x.symbol).concat(FOLLOW.map(f=>f.symbol)))].slice(0,20);
  for(const s of syms){try{const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(s)}&token=${encodeURIComponent(k)}`);if(r.ok){const q=await r.json();if(q.c)LIVE[s]=q.c}}catch(e){}}
  render();
}
$$('.seg button').forEach(b=>b.onclick=()=>{SEG=b.dataset.seg;$$('.seg button').forEach(x=>x.classList.toggle('on',x===b));render()});
$('#list').addEventListener('click',e=>{const b=e.target.closest('.stock');if(b){const it=items()[+b.dataset.i];if(it)open(Object.assign({date:WL&&WL.date},it))}});
$('#openSet').onclick=settings;
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
load();setInterval(()=>{if(!document.hidden)load()},3*60000);setInterval(poll,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.host)){try{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});let r0=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(r0){r0=false;location.reload()}})}catch(e){}}
})();
</script>
