services:
  - type: web
    name: ramazan-hoca
    runtime: python
    rootDir: roastbot
    buildCommand: "true"
    startCommand: python3 server.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: APP_PASSWORD
        sync: false
